[project]
name = "robustnn"
version = "0.1.0"
description = "A collection of robust neural network architectures developed at the Australian Centre for Robotics (ACFR)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Nicholas Barbara", email = "nicholas.barbara@epfl.ch" },
    { name = "Ruigang Wang" },
    { name = "Dechuan Liu" },
    { name = "Michael Somerfield" },
    { name = "Jing Cheng" },
    { name = "Yurui Zhang" },
    { name = "Ian Manchester" },
]

# Dependencies required by the `robustnn/` package itself. Versions are pinned to
# those the models are currently tested against; `uv.lock` fixes the full set.
dependencies = [
    "flax>=0.12.10",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
# CPU-only build. jax comes in (as the CPU build) via flax; torch is routed to
# the CPU index via [tool.uv.sources] below.
cpu = [
    "torch",
    "jax",
]

# GPU build (CUDA 13). Selected automatically by `install.sh`.
cuda13 = [
    "jax[cuda13]>=0.11.2",
    "torch",
]

# Everything needed to run the demos in `examples/` (including the Colab
# notebooks) and the scripts in `test/`, but not needed to use `robustnn`.
examples = [
    "optax>=0.2.8",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "tensorflow-datasets>=4.9.10",
    "tensorflow>=2.21.0",
    "matplotlib>=3.11.2",
    "cycler>=0.12.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "robustnn"
module-root = ""

# --- PyTorch index routing -------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
# The cpu and cuda13 extras are mutually exclusive. Declaring this lets uv
# resolve them as separate forks within a single lockfile.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda13" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda13"},
]
